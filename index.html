<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글로벌 타임 & 웨더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-xl rounded-2xl p-8 space-y-6">
        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">트래블 타이밍 & 혼잡도</h1>
            <p class="text-gray-500">최적의 여행 시기와 현지 상황을 확인하세요</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="flex p-1 bg-gray-100/50 rounded-xl">
            <button id="tab-status" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-semibold transition-all bg-white shadow-sm text-indigo-600">
                <i data-lucide="sun" size="16"></i> 날씨/시간
            </button>
            <button id="tab-insights" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-semibold transition-all text-gray-500 hover:text-indigo-600">
                <i data-lucide="trending-up" size="16"></i> 여행 인사이트
            </button>
            <button id="tab-partnership" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-semibold transition-all text-gray-500 hover:text-indigo-600">
                <i data-lucide="mail" size="16"></i> 제휴 문의
            </button>
        </nav>

        <!-- Section: Status (Time & Weather) -->
        <div id="section-status" class="space-y-6">
            <!-- Time Comparison Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Korean Time (Source) -->
                <div class="bg-white/50 p-4 rounded-xl border border-gray-100 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-indigo-500 uppercase tracking-wider">서울 (KST)</label>
                        <button id="set-now" class="text-[10px] bg-indigo-100 text-indigo-600 px-2 py-1 rounded-md hover:bg-indigo-200 transition-colors">NOW</button>
                    </div>
                    <input type="datetime-local" id="kst-input" 
                        class="w-full bg-transparent text-xl font-bold text-gray-800 focus:outline-none">
                </div>

                <!-- Local Time (Target) -->
                <div class="bg-indigo-600 p-4 rounded-xl shadow-lg shadow-indigo-200">
                    <div class="flex justify-between items-center mb-2">
                        <label id="target-city-label" class="text-xs font-bold text-indigo-100 uppercase tracking-wider">대상 도시</label>
                        <span class="text-[10px] bg-white/20 text-white px-2 py-1 rounded-md">LOCAL</span>
                    </div>
                    <div id="local-time" class="text-xl font-bold text-white">--:--</div>
                    <div id="local-date" class="text-[11px] text-indigo-100 mt-1 opacity-80">--월 --일 ---요일</div>
                </div>
            </div>

            <div class="space-y-4">
                <!-- Search & Select -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">도시 검색 및 선택</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input type="text" id="city-search" placeholder="도시 이름 검색..." 
                                class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            <i data-lucide="search" class="absolute left-3 top-3.5 text-gray-400" size="18"></i>
                        </div>
                        <select id="city-select" 
                            class="w-40 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-medium">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Enhanced Weather Section -->
            <div id="result-container" class="hidden space-y-4 animate-in slide-in-from-bottom-4 duration-500">
                <div id="weather-card" class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                    <div class="relative z-10 flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <i data-lucide="map-pin" size="14" class="text-indigo-200"></i>
                                <span id="display-city-name" class="text-sm font-medium text-indigo-100">City, Country</span>
                            </div>
                            <h2 id="temp-display" class="text-5xl font-black">--°C</h2>
                            <p id="weather-desc" class="text-lg font-semibold mt-1 opacity-90">날씨 불러오는 중...</p>
                        </div>
                        <div id="weather-icon" class="bg-white/20 p-4 rounded-2xl backdrop-blur-md">
                            <i data-lucide="cloud-sun" size="48"></i>
                        </div>
                    </div>

                    <!-- Weather Details -->
                    <div class="grid grid-cols-3 gap-2 mt-6 pt-6 border-t border-white/10">
                        <div class="text-center">
                            <p class="text-[10px] uppercase text-indigo-200 font-bold mb-1">습도</p>
                            <div class="flex items-center justify-center gap-1">
                                <i data-lucide="droplets" size="12"></i>
                                <span id="humidity" class="text-sm font-bold">--%</span>
                            </div>
                        </div>
                        <div class="text-center border-x border-white/10">
                            <p class="text-[10px] uppercase text-indigo-200 font-bold mb-1">풍속</p>
                            <div class="flex items-center justify-center gap-1">
                                <i data-lucide="wind" size="12"></i>
                                <span id="windspeed" class="text-sm font-bold">--km/h</span>
                            </div>
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] uppercase text-indigo-200 font-bold mb-1">체감</p>
                            <div class="flex items-center justify-center gap-1">
                                <i data-lucide="thermometer" size="12"></i>
                                <span id="apparent-temp" class="text-sm font-bold">--°C</span>
                            </div>
                        </div>
                    </div>
                    <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-white/10 rounded-full blur-3xl"></div>
                </div>
            </div>
        </div>

        <!-- Section: Insights -->
        <div id="section-insights" class="hidden space-y-6">
            <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-6 border border-amber-100">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="award" class="text-amber-500"></i>
                    <h3 class="font-bold text-gray-800">여행 추천 지수</h3>
                </div>
                <div class="flex items-end gap-4 mb-2">
                    <div id="readiness-score" class="text-5xl font-black text-amber-600">--%</div>
                    <div id="readiness-label" class="text-sm font-bold text-amber-700 mb-2">보통</div>
                </div>
                <p id="timing-desc" class="text-sm text-gray-600 leading-relaxed">준비된 데이터를 기반으로 최적의 타이밍을 계산 중입니다...</p>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="users" size="18" class="text-indigo-500"></i> 혼잡도 예측
                    </h3>
                    <span id="congestion-level" class="text-xs font-bold px-2 py-1 rounded bg-indigo-100 text-indigo-600">데이터 없음</span>
                </div>
                <div class="h-3 w-full bg-gray-100 rounded-full overflow-hidden">
                    <div id="congestion-bar" class="h-full bg-indigo-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
                <p id="congestion-desc" class="text-xs text-gray-500 italic">※ 과거 방문 데이터와 시즌별 통계를 기반으로 산출된 예측치입니다.</p>
            </div>
        </div>

        <!-- Section: Partnership -->
        <div id="section-partnership" class="hidden space-y-6">
            <div class="bg-white/50 p-6 rounded-2xl border border-gray-100">
                <h3 class="text-xl font-bold text-gray-800 mb-4">제휴 및 마케팅 문의</h3>
                <form action="https://formspree.io/f/xnjwdoal" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">성함 / 기업명</label>
                        <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">이메일 주소</label>
                        <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">문의 내용</label>
                        <textarea name="message" rows="4" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200">
                        문의 보내기
                    </button>
                </form>
            </div>
        </div>

        <footer class="text-center text-xs text-gray-400 pt-4">
            Powered by Open-Meteo & Gemini CLI
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
