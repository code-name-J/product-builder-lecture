<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글로벌 타임 & 웨더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-xl rounded-2xl p-8 space-y-8">
        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">글로벌 타임 & 웨더</h1>
            <p class="text-gray-500">시간 변환과 날씨 확인을 한눈에</p>
        </header>

        <!-- Time Comparison Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Korean Time (Source) -->
            <div class="bg-white/50 p-4 rounded-xl border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-indigo-500 uppercase tracking-wider">서울 (KST)</label>
                    <button id="set-now" class="text-[10px] bg-indigo-100 text-indigo-600 px-2 py-1 rounded-md hover:bg-indigo-200 transition-colors">NOW</button>
                </div>
                <input type="datetime-local" id="kst-input" 
                    class="w-full bg-transparent text-xl font-bold text-gray-800 focus:outline-none">
            </div>

            <!-- Local Time (Target) -->
            <div class="bg-indigo-600 p-4 rounded-xl shadow-lg shadow-indigo-200">
                <div class="flex justify-between items-center mb-2">
                    <label id="target-city-label" class="text-xs font-bold text-indigo-100 uppercase tracking-wider">대상 도시</label>
                    <span class="text-[10px] bg-white/20 text-white px-2 py-1 rounded-md">LOCAL</span>
                </div>
                <div id="local-time" class="text-xl font-bold text-white">--:--</div>
                <div id="local-date" class="text-[11px] text-indigo-100 mt-1 opacity-80">--월 --일 ---요일</div>
            </div>
        </div>

        <div class="space-y-4">
            <!-- Search & Select -->
            <div class="relative">
                <label class="block text-sm font-semibold text-gray-700 mb-1">도시 검색 및 선택</label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="city-search" placeholder="도시 이름 검색..." 
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <i data-lucide="search" class="absolute left-3 top-3.5 text-gray-400" size="18"></i>
                    </div>
                    <select id="city-select" 
                        class="w-40 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-medium">
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Enhanced Weather Section -->
        <div id="result-container" class="hidden space-y-4 animate-in slide-in-from-bottom-4 duration-500">
            <div id="weather-card" class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                <div class="relative z-10 flex justify-between items-start">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <i data-lucide="map-pin" size="14" class="text-indigo-200"></i>
                            <span id="display-city-name" class="text-sm font-medium text-indigo-100">City, Country</span>
                        </div>
                        <h2 id="temp-display" class="text-5xl font-black">--°C</h2>
                        <p id="weather-desc" class="text-lg font-semibold mt-1 opacity-90">날씨 불러오는 중...</p>
                    </div>
                    <div id="weather-icon" class="bg-white/20 p-4 rounded-2xl backdrop-blur-md">
                        <i data-lucide="cloud-sun" size="48"></i>
                    </div>
                </div>

                <!-- Weather Details -->
                <div class="grid grid-cols-3 gap-2 mt-6 pt-6 border-t border-white/10">
                    <div class="text-center">
                        <p class="text-[10px] uppercase text-indigo-200 font-bold mb-1">습도</p>
                        <div class="flex items-center justify-center gap-1">
                            <i data-lucide="droplets" size="12"></i>
                            <span id="humidity" class="text-sm font-bold">--%</span>
                        </div>
                    </div>
                    <div class="text-center border-x border-white/10">
                        <p class="text-[10px] uppercase text-indigo-200 font-bold mb-1">풍속</p>
                        <div class="flex items-center justify-center gap-1">
                            <i data-lucide="wind" size="12"></i>
                            <span id="windspeed" class="text-sm font-bold">--km/h</span>
                        </div>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] uppercase text-indigo-200 font-bold mb-1">체감</p>
                        <div class="flex items-center justify-center gap-1">
                            <i data-lucide="thermometer" size="12"></i>
                            <span id="apparent-temp" class="text-sm font-bold">--°C</span>
                        </div>
                    </div>
                </div>
                
                <!-- Background Decoration -->
                <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-white/10 rounded-full blur-3xl"></div>
            </div>
        </div>

        <footer class="text-center text-xs text-gray-400 pt-4">
            Powered by Open-Meteo & Gemini CLI
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
