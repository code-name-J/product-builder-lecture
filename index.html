<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신비로운 오늘의 운세</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <header>
            <h1 class="mystical-title">The Oracle</h1>
            <p class="subtitle">별들이 당신의 오늘을 이야기합니다</p>
        </header>

        <main>
            <section id="input-section" class="card">
                <div class="card-content">
                    <p class="instruction">당신의 정보를 입력하여 운명을 확인하세요</p>
                    <div class="input-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="input-group">
                        <label for="birthdate">생년월일</label>
                        <input type="date" id="birthdate" required>
                    </div>
                    <button id="fortune-btn" class="mystical-btn">운세 확인하기</button>
                </div>
            </section>

            <section id="loading-section" class="hidden">
                <div class="oracle-loader">
                    <div class="loader-circle"></div>
                    <p>별의 궤적을 분석하는 중...</p>
                </div>
            </section>

            <section id="result-section" class="card hidden">
                <div class="card-content">
                    <h2 id="fortune-title" class="result-title">오늘의 예언</h2>
                    <div class="fortune-details">
                        <div class="fortune-item">
                            <span class="icon">✨</span>
                            <div class="text-group">
                                <h3>종합운</h3>
                                <p id="general-fortune"></p>
                            </div>
                        </div>
                        <div class="fortune-item">
                            <span class="icon">💰</span>
                            <div class="text-group">
                                <h3>재물운</h3>
                                <p id="wealth-fortune"></p>
                            </div>
                        </div>
                        <div class="fortune-item">
                            <span class="icon">❤️</span>
                            <div class="text-group">
                                <h3>연애운</h3>
                                <p id="love-fortune"></p>
                            </div>
                        </div>
                    </div>
                    <button id="retry-btn" class="mystical-btn outline">다시 확인하기</button>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
